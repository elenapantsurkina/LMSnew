services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lms_network

  redis:
    image: redis:latest
    networks:
      - lms_network

  celery:
    build: .
    command: poetry run celery -A config worker -l INFO --concurrency=500 --pool=gevent
    volumes:
      - .:/lms_drf
    depends_on:
      - postgres
      - redis
    networks:
      - lms_network

  celery-beat:
    build: .
    command: poetry run celery -A config beat --loglevel=info
    volumes:
      - .:/lms_drf
    depends_on:
      - postgres
      - redis
    networks:
      - lms_network

  lms_drf:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "poetry run python manage.py collectstatic --noinput && poetry run gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/lms_drf
      - static_volume:/lms_drf/staticfiles
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      - postgres
      - redis
    networks:
      - lms_network

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/nginx/staticfiles
    depends_on:
      - lms_drf
    networks:
      - lms_network

networks:
  lms_network:

volumes:
  postgres_data:
  static_volume: